name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  quality:
    name: Quality and executable notebook
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout v4 (tag resolved 2026-08-06)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.12
        # actions/setup-python v5 (tag resolved 2026-08-06)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install quality, render, and notebook dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,render,notebook]"
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk

      - name: Validate skill structure and package metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import re
          import tomllib
          from soccer_predict import __version__

          required = [
              Path("SKILL.md"),
              Path("README.md"),
              Path("LICENSE"),
              Path("clawhub.json"),
              Path("agents/openai.yaml"),
              Path("analysis/htft_history_validation.ipynb"),
              Path("analysis/fixtures/htft_history_validation_smoke.json"),
              Path("analysis/fixtures/visible_market_snapshot.json"),
              Path("soccer_predict/__init__.py"),
              Path("soccer_predict/cli.py"),
              Path("soccer_predict/doctor.py"),
              Path("soccer_predict/domain/probabilities.py"),
              Path("soccer_predict/domain/settlement.py"),
              Path("scripts/forward_policy.py"),
              Path("scripts/forward_validation.py"),
              Path("scripts/artifact_lineage.py"),
              Path("scripts/cohort_scope.py"),
              Path("scripts/source_evidence.py"),
              Path("scripts/fundamental_evidence.py"),
              Path("scripts/execution_evidence.py"),
              Path("scripts/memory_store.py"),
              Path("scripts/score_model.py"),
              Path("scripts/joint_scenario_model.py"),
              Path("scripts/joint_path_kernel.py"),
              Path("scripts/public_market_outlook.py"),
              Path("scripts/publication_outlook.py"),
              Path("scripts/gate_stats.py"),
              Path("scripts/prediction_card_renderer.py"),
              Path("scripts/review_card_renderer.py"),
              Path("scripts/plain_text_formatter.py"),
              Path("scripts/history_importer.py"),
              Path("scripts/htft_model.py"),
              Path("scripts/htft_ranker.py"),
              Path("scripts/htft_holdout_evaluator.py"),
              Path("scripts/league_model_manager.py"),
              Path("scripts/lineup_scheduler.py"),
              Path("scripts/review_scheduler.py"),
              Path("references/data-collection.md"),
              Path("references/history-workbook-data.md"),
              Path("references/half-time-full-time.md"),
              Path("references/model-validation.md"),
              Path("references/prediction-framework.md"),
              Path("references/image-output.md"),
              Path("references/plain-text-output.md"),
              Path("references/review-framework.md"),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f"Missing required files: {', '.join(missing)}")

          skill = Path("SKILL.md").read_text(encoding="utf-8")
          if not skill.startswith("---\n"):
              raise SystemExit("SKILL.md must start with YAML front matter")
          front_matter = skill.split("---", 2)[1]
          for field in ("name", "description"):
              if not re.search(rf"(?m)^{field}:\s*\S", front_matter):
                  raise SystemExit(f"SKILL.md front matter is missing {field}")
          for target in re.findall(r"\]\(([^)#]+)", skill):
              if "://" not in target and not Path(target).is_file():
                  raise SystemExit(f"SKILL.md references a missing file: {target}")

          marketplace = json.loads(Path("clawhub.json").read_text(encoding="utf-8"))
          notebook = json.loads(
              Path("analysis/htft_history_validation.ipynb").read_text(encoding="utf-8")
          )
          if notebook.get("nbformat") != 4 or not notebook.get("cells"):
              raise SystemExit("HT/FT validation notebook is malformed")
          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          if project["version"] != marketplace["version"]:
              raise SystemExit("pyproject.toml and clawhub.json versions differ")
          if project["version"] != __version__:
              raise SystemExit("pyproject.toml and soccer_predict.__version__ differ")
          if project["scripts"]["soccer-predict"] != "soccer_predict.cli:main":
              raise SystemExit("soccer-predict console script is not installed")
          if not any("tzdata" in dependency for dependency in project["dependencies"]):
              raise SystemExit("Windows tzdata dependency is missing")
          if marketplace.get("license") != "MIT":
              raise SystemExit("clawhub.json must declare the MIT license")
          PY

      - name: Compile Python sources
        run: python -B -X utf8 -m compileall -q soccer_predict scripts tests

      - name: Lint all Python sources and tests
        run: |
          ruff check soccer_predict scripts tests
          ruff format --check soccer_predict scripts tests

      - name: Type-check installable package
        run: mypy soccer_predict

      - name: Enforce coverage for the new installable package
        run: >-
          python -m pytest -q tests/test_cli_doctor.py
          --cov=soccer_predict.cli
          --cov=soccer_predict.doctor
          --cov-report=term-missing
          --cov-fail-under=80

      - name: Execute HT/FT notebook with the non-evidence CI fixture
        env:
          SOCCER_PREDICT_NOTEBOOK_MODE: ci-smoke
        run: >-
          jupyter nbconvert
          --to notebook
          --execute analysis/htft_history_validation.ipynb
          --ExecutePreprocessor.timeout=180
          --output htft_history_validation.executed.ipynb
          --output-dir "${RUNNER_TEMP}"

  tests:
    name: Python ${{ matrix.python-version }} full suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        # actions/checkout v4 (tag resolved 2026-08-06)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        # actions/setup-python v5 (tag resolved 2026-08-06)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,render]"
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk

      - name: Run categorized suite
        run: python -m pytest -q --junitxml="test-results-${{ matrix.python-version }}.xml"

      - name: Upload categorized test results
        if: always()
        # actions/upload-artifact v4 (tag resolved 2026-08-06)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: test-results-${{ matrix.python-version }}.xml
          if-no-files-found: error

  windows:
    name: Windows package and watchdog smoke
    runs-on: windows-latest
    steps:
      - name: Check out repository
        # actions/checkout v4 (tag resolved 2026-08-06)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.12
        # actions/setup-python v5 (tag resolved 2026-08-06)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install project
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,render]"
          python -m pip check

      - name: Run local doctor without network access
        shell: pwsh
        run: soccer-predict doctor --workspace $env:GITHUB_WORKSPACE --json

      - name: Run full suite on Windows
        shell: pwsh
        run: python -m pytest -q --junitxml="test-results-windows.xml"

      - name: Upload Windows test results
        if: always()
        # actions/upload-artifact v4 (tag resolved 2026-08-06)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-results-windows
          path: test-results-windows.xml
          if-no-files-found: error

      - name: Install and remove optional recurring watchdog
        shell: pwsh
        run: |
          $taskName = "SoccerPredict-CI-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $installer = Join-Path $env:GITHUB_WORKSPACE "scripts/install_windows_watchdog.ps1"
          [string]$pythonPath = (& python -c "import sys; print(sys.executable)").Trim()
          if (-not (Test-Path -LiteralPath $pythonPath)) {
            throw "Python executable does not exist: $pythonPath"
          }
          try {
            & $installer install -AllowRecurring -Workspace $env:GITHUB_WORKSPACE -PythonPath $pythonPath -TaskName $taskName
            & $installer status -TaskName $taskName
            & $installer disable -TaskName $taskName
          }
          finally {
            & $installer uninstall -TaskName $taskName
          }

  newer-python-smoke:
    name: Python ${{ matrix.python-version }} compatibility smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Check out repository
        # actions/checkout v4 (tag resolved 2026-08-06)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        # actions/setup-python v5 (tag resolved 2026-08-06)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and smoke dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Compile and run provenance/evidence smoke
        run: |
          python -B -X utf8 -m compileall -q soccer_predict scripts
          python -m pytest -q \
            tests/test_release_version.py \
            tests/test_artifact_lineage.py \
            tests/test_cohort_scope.py \
            tests/test_fundamental_evidence.py \
            tests/test_execution_evidence.py

  clean-install:
    name: Clean wheel install smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout v4 (tag resolved 2026-08-06)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.12
        # actions/setup-python v5 (tag resolved 2026-08-06)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Build and install wheel in a fresh virtual environment
        run: |
          python -m pip install --upgrade build
          python -m build
          python -m venv "${RUNNER_TEMP}/soccer-predict-smoke"
          "${RUNNER_TEMP}/soccer-predict-smoke/bin/python" -m pip install dist/*.whl
          "${RUNNER_TEMP}/soccer-predict-smoke/bin/python" -m pip check
          "${RUNNER_TEMP}/soccer-predict-smoke/bin/soccer-predict" --version
          "${RUNNER_TEMP}/soccer-predict-smoke/bin/soccer-predict" doctor --workspace . --json

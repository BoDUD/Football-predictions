[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soccer-predict"
version = "3.3.0"
description = "Football match analysis skill with guarded recommendations and verified reviews"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "BoDUD" }]
dependencies = []
keywords = ["football", "soccer", "prediction", "odds", "codex-skill"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/BoDUD/Football-predictions"
Issues = "https://github.com/BoDUD/Football-predictions/issues"

[tool.setuptools]
packages = []
